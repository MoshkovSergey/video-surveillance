services:
  postgres:
    image: ${POSTGRES_IMAGE:-postgres:alpine}
    container_name: vs-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}

    ports:
      - "${POSTGRES_PORT:-5432}:5432"

    volumes:
      - vs_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  mediamtx:
    image: bluenviron/mediamtx:latest
    container_name: vs-mediamtx
    restart: unless-stopped
    ports:
      - "8554:8554" # RTSP
      - "1935:1935" # RTMP
      - "8888:8888" # HLS
      - "8889:8889" # WebRTC
      - "8830:8830" # MediaMTX HTTP API
    # MediaMTX стартует мгновенно и не требует сложного healthcheck для MVP

volumes:
  vs_postgres_data: